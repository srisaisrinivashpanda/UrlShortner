name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x Url-Shortner-sb/mvnw

      - name: Build and Package Spring Boot
        run: cd Url-Shortner-sb && ./mvnw clean package -DskipTests -B

  frontend:
    name: Frontend Build (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Url-Shortner-Frontend/package-lock.json

      - name: Install Dependencies
        run: cd Url-Shortner-Frontend && npm ci

      - name: Build Vite Bundle
        run: cd Url-Shortner-Frontend && npm run build
