services:
  # Spring Boot Backend API
  - type: web
    name: shortify-backend
    runtime: docker
    dockerfilePath: ./Url-Shortner-sb/Dockerfile
    dockerContext: ./Url-Shortner-sb
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 9090
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: shortify-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: shortify-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: shortify-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173

  # React Frontend Static Site
  - type: static
    name: shortify-frontend
    buildCommand: cd Url-Shortner-Frontend && npm install && npm run build
    staticPublishPath: ./Url-Shortner-Frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: shortify-backend
          property: host

databases:
  - name: shortify-db
    databaseName: urlshortenerdb
    user: postgres
    plan: free
